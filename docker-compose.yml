services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - backend
    restart: unless-stopped

  # Issues/renews the TLS cert. Inert until a real domain points at this host —
  # see PROGRESS.md for the one-time activation command (needs hosting first).
  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h; done"

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      - postgres
      - redis
      - qdrant
    volumes:
      - ./engagements:/engagements
    expose:
      - "8000"
    restart: unless-stopped

  worker:
    build: ./worker
    env_file: .env
    depends_on:
      - postgres
      - redis
      - qdrant
    volumes:
      - ./engagements:/engagements
    user: "1000:1000"       # non-root
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    expose:
      - "6333"
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
